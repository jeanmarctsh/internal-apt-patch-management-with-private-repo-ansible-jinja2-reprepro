services:
  # 1 Prometheus installation
  prometheus:
    image: prom/prometheus:v3.16.0
    

    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./rules:/etc/prometheus/rules:ro
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml" ## telling prom where is the file conf location
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    
    restart: unless-stopped

    logging:                                            
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - cadvisor 
    
      #- alertmanager
    
    networks:
      - web_proxy


  # 2. installation of Grafana
  
  grafana: 
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}  
    depends_on:
      - prometheus
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    logging:                                              
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - web_proxy

      
  
  # 3. Cadvisor setup for monitoring docker containers (cpu, ram, etc...)

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    logging:                                           
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - web_proxy

  # 4. Installation d'alertmanager 

        

volumes:
  prometheus-data: {}
  grafana-data: {}


networks:
  web_proxy:
    driver: bridge