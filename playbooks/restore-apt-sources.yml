--- 
- name: restore official apt source file on client machines
  hosts: workers, autoflows
  become: true # connect as root on target machine 
  gather_facts: false

  vars:
    # backup file location on master node
    apt_source_backup:  "{{ lookup('env', 'HOME') }}/sources.list"
    # backup file destination
    apt_source_destination: /etc/apt/sources.list 
    # old save file location (which was empty)
    path_apt_source_backup_file_extension: /etc/apt/sources.list.old

    apt_sources_dir:

      - /etc/apt/sources.list.d

    apt_keyrings_dir:

      - /etc/apt/keyrings


  tasks:

    - name: verify if a backup is available on master
      ansible.builtin.stat:
        path: "{{apt_source_backup}}"
      delegate_to: localhost 
      become: false # no sudo on master 
      run_once: true
      register: apt_backup

    - name: stop the process if the backup isn't available 

      ansible.builtin.assert:
        that:
          - apt_backup.stat.exists
          - apt_backup.stat.isreg
          - apt_backup.stat.size > 0
        fail_msg: source file not available
      run_once: true 

    
    - name: "checking of {{path_apt_source_backup_file_extension}}"
      ansible.builtin.stat:
        path: "{{ path_apt_source_backup_file_extension }}"
      register: empty_backup_file

    
    - name: " remove {{path_apt_source_backup_file_extension}}"
      ansible.builtin.file:
        path: "{{path_apt_source_backup_file_extension}}"
        state: absent
      when:
        - empty_backup_file.stat.exists
        - empty_backup_file.stat.isreg
        - empty_backup_file.stat.size | int == 0


    - name: "Find private apt file source in directory {{apt_sources_dir}} "
      ansible.builtin.find:
        paths: "{{apt_sources_dir}}"
        file_type: file
        patterns: 
          - '^(autoflow\.list|autoflow\.list\.old)$'
        use_regex: true
        hidden: false
        recurse: false
      register: apt_source_files


    - name: Find all files inside apt subdirectories
      ansible.builtin.find:
        paths: "{{apt_keyrings_dir}}"
        file_type: file
        patterns: 
           - '^(autoflow\.gpg|auto\.gpg|auto\.gpg\.old)$'
        use_regex: true
        hidden: false
        recurse: false
      register: found_apt_key

    - name: Display all files selected for cleanup
      ansible.builtin.debug:
        msg: >-
          File: {{ item.path }},
          size: {{ item.size }} bytes
      loop: "{{ apt_source_files.files + found_apt_key.files }}"
      loop_control:
        label: "{{ item.path }}"


    - name: Remove identified private APT source files
      ansible.builtin.file:
        path: "{{item.path}}"
        state: absent
      loop: "{{ apt_source_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove identified private APT keyring files
      ansible.builtin.file:
        path: "{{item.path}}"
        state: absent
      loop: "{{ found_apt_key.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: restore original Ubuntu repository on client machines
      ansible.builtin.copy:
        src: "{{apt_source_backup}}"
        dest: "{{apt_source_destination}}"
        owner: root
        group: root
        mode: '0644'
        backup: false
      validate: 'cat %s | grep -q "ubuntu.com"'

    - name: execute apt-get update as command
      ansible.builtin.apt:
        update_cache: yes     